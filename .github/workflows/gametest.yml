name: Game Tests

on:
  workflow_dispatch:
  push:
    branches:
      - 'experiment/update-interaction'
    paths-ignore:
      - '.github/research/**'
      - '.github/workflows/interaction-research.yml'

concurrency:
  group: gametest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gametest:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Gradle
        uses: GeyserMC/actions/setup-gradle-composite@master
        with:
          setup-java_java-version: 25

      - name: List game test tasks
        run: ./gradlew :gametest:tasks --all | grep -i -E "gametest|datagen" || true

      - name: Run game tests
        run: ./gradlew :gametest:runGameTest --stacktrace 2>&1 | tee gametest.log; exit ${PIPESTATUS[0]}

      # Printed last so the summary is at the end of the job log
      - name: Summary
        if: always()
        run: |
          grep -E "tests failed|failed at" gametest.log | sed -E 's/^\[[0-9:]+\] \[[^]]*\] \([^)]*\) ?//' | cut -c1-400 || true
          echo "===== MISMATCH DETAILS ====="
          awk '/ interaction mismatches.*:$/{print; n=60; next} n>0 && !/^\[[0-9:]+\]/{print substr($0,1,400); n--; next} {n=0}' gametest.log || true
          echo "===== TIMINGS ====="
          grep -E "simulated clicks in" gametest.log | sed -E 's/^\[[0-9:]+\] \[[^]]*\] \([^)]*\) ?//' || true
          awk '/----- BEGIN /{p=1} p{print} /----- END /{p=0}' gametest.log | sed -E 's/^\[[0-9:]+\] \[[^]]*\] \([^)]*\) ?//' || true
